name: Publish NuGet Packages

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: Instancian

      - name: Pack InstantAIGate.Core
        run: dotnet pack src/InstantAIGate.Core/InstantAIGate.Core.csproj -c Release -o ./nupkg

      - name: Pack InstantAIGate.Client
        run: dotnet pack src/InstantAIGate.Client/InstantAIGate.Client.csproj -c Release -o ./nupkg

      - name: Push InstantAIGate.Core to NuGet
        run: dotnet nuget push ./nupkg/InstantAIGate.Core.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push InstantAIGate.Client to NuGet
        run: dotnet nuget push ./nupkg/InstantAIGate.Client.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate