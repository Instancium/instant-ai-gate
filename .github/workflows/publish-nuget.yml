name: Publish InstantAIGate.Core to NuGet

on:
  release:
    types: [published]


permissions:
  id-token: write 
  contents: read  

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        with:
         user: Instancian

    
      - name: Extract Version and Pack
        shell: pwsh
        run: |
          $serverProjectFile = "src/InstantAIGate.Server/InstantAIGate.Server.csproj"
          if (-not (Test-Path $serverProjectFile)) {
              Write-Host "Error: Cannot find $serverProjectFile"
              exit 1
          }

          $serverContent = Get-Content $serverProjectFile -Raw
          $versionMatch = [regex]::Match($serverContent, '<Version>(.*?)</Version>')

          if ($versionMatch.Success) {
              $Version = $versionMatch.Groups[1].Value.Trim()
              Write-Host "Target version: $Version"
          } else {
              Write-Host "Error: Could not find <Version>"
              exit 1
          }

          dotnet pack src/InstantAIGate.Core/InstantAIGate.Core.csproj -c Release -p:PackageVersion=$Version -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ env.NUGET_AUTH_TOKEN }} --skip-duplicate