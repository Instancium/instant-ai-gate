services:
  gateway:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    image: ghcr.io/your-org/instantaigate:latest
    container_name: instantaigate-server
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
environment:
      # The container will fail to start if ADMIN_API_KEY is not explicitly set
      - InstantAIGate__AdminApiKey=${ADMIN_API_KEY:?ADMIN_API_KEY must be strictly defined in the host environment or .env file}
      # Required for proper Vulkan ICD detection inside the container
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Map the host models directory directly into the container
      - ./data/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            # NVIDIA Container Toolkit integration
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      # Direct Rendering Manager passthrough for Vulkan (AMD/Intel compatibility)
      - /dev/dri:/dev/dri