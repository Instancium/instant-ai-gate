services:
  gateway:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    image: ghcr.io/your-org/instantaigate:latest
    container_name: instantaigate-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - InstantAIGate__AdminApiKey=${ADMIN_API_KEY:?ADMIN_API_KEY must be strictly defined in the host environment or .env file}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./data/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]